<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LLM Proxy</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #1a1a2e;
      color: #eee;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .container {
      text-align: center;
    }
    h1 {
      font-size: 2rem;
      color: #4fc3f7;
    }
    p {
      color: #888;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>LLM Proxy</h1>
    <p>Electron shell ready. IPC bridge active.</p>
  </div>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const el = document.querySelector("p");
      if (window.ipc) {
        window.ipc.invoke("app:ping").then((res) => {
          if (el && res === "pong") {
            el.textContent = "IPC bridge verified: pong";
          }
        });
      }
    });
  </script>
</body>
</html>
