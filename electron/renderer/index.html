<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LLM Proxy</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #1a1a2e;
      color: #eee;
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .tab-bar {
      display: flex;
      background: #0f3460;
      padding: 0.5rem 1rem;
      gap: 0.25rem;
    }
    .tab-btn {
      background: transparent; color: #aaa; border: none;
      padding: 0.6rem 1.2rem; border-radius: 6px; cursor: pointer;
      font-weight: 600; font-size: 0.95rem;
    }
    .tab-btn.active { background: #4fc3f7; color: #1a1a2e; }

    .tab-content { display: none; flex: 1; overflow: hidden; }
    .tab-content.active { display: flex; }

    /* Master-Detail layout */
    .md-layout { display: flex; width: 100%; height: 100%; }
    .md-left {
      width: 280px; min-width: 280px;
      background: #0f3460;
      padding: 1rem;
      overflow-y: auto;
      border-right: 1px solid #2a4a7a;
    }
    .md-right {
      flex: 1;
      padding: 1.5rem;
      overflow-y: auto;
    }

    .list-item {
      padding: 0.6rem 0.8rem;
      border-radius: 6px;
      cursor: pointer;
      margin-bottom: 0.4rem;
      font-size: 0.9rem;
    }
    .list-item:hover { background: #16213e; }
    .list-item.selected { background: #16213e; outline: 2px solid #4fc3f7; }
    .list-item .sub-badge { font-size: 0.7rem; color: #aaa; display: block; margin-top: 0.2rem; }

    h2 { font-size: 1.1rem; color: #4fc3f7; margin: 0 0 1rem; }
    .section { margin-bottom: 1.5rem; }
    .toolbar { display: flex; gap: 0.5rem; margin-bottom: 1rem; align-items: center; flex-wrap: wrap; }

    button {
      background: #4fc3f7; color: #1a1a2e; border: none;
      padding: 0.5rem 1rem; border-radius: 6px; cursor: pointer; font-weight: 600;
    }
    button:hover { background: #3ab4e8; }
    button.danger { background: #c62828; color: #fff; }
    button.danger:hover { background: #a11d1d; }

    select, input {
      width: 100%; padding: 0.4rem 0.6rem; margin-bottom: 0.5rem;
      background: #0f3460; color: #eee; border: 1px solid #2a4a7a; border-radius: 4px; font-size: 0.9rem;
    }

    .detail-card {
      background: #16213e; border-radius: 8px; padding: 1rem; margin-bottom: 1rem;
    }
    .detail-card h3 { font-size: 1rem; color: #4fc3f7; margin: 0 0 0.5rem; }
    .meta { color: #888; font-size: 0.85rem; margin-bottom: 0.5rem; }
    .edit-row { display: flex; gap: 0.5rem; align-items: center; margin-bottom: 0.6rem; }
    .edit-row label { flex: 1; font-size: 0.85rem; color: #aaa; white-space: nowrap; }

    /* App rows */
    .app-row {
      display: flex; align-items: center; gap: 1rem;
      background: #16213e; border-radius: 8px; padding: 0.8rem 1rem; margin-bottom: 0.6rem;
    }
    .app-row .app-name { flex: 1; font-size: 0.95rem; }
    .app-row .app-status { font-size: 0.8rem; color: #888; }

    /* Log */
    .log-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    .log-table th, .log-table td { padding: 0.4rem 0.6rem; text-align: left; border-bottom: 1px solid #2a4a7a; }
    .log-table th { color: #4fc3f7; }
    .log-fail { color: #c62828; font-weight: 600; }
    .log-ok { color: #a5d6a7; }

    .empty { color: #666; font-style: italic; }
    .hint { color: #888; font-size: 0.8rem; margin-bottom: 1rem; }
    .form-section { background: #16213e; border-radius: 8px; padding: 1rem; }
    label { display: block; font-size: 0.85rem; color: #aaa; margin-bottom: 0.3rem; }
    .row { display: flex; gap: 0.5rem; }
    .row > * { flex: 1; }
    .error { color: #c62828; font-size: 0.8rem; margin-top: 0.3rem; }
  </style>
</head>
<body>
  <div class="tab-bar">
    <button class="tab-btn active" data-tab="providers">Providers</button>
    <button class="tab-btn" data-tab="apps">App Settings</button>
    <button class="tab-btn" data-tab="log">Log</button>
  </div>

  <!-- Tab 1: Providers (master-detail) -->
  <div class="tab-content active" id="tab-providers">
    <div class="md-layout">
      <div class="md-left">
        <h2>Providers</h2>
        <div class="toolbar">
          <button id="refresh-btn">Refresh</button>
          <button id="remove-btn" class="danger">Remove</button>
        </div>
        <div id="provider-list"><p class="empty">Loading…</p></div>
      </div>
      <div class="md-right">
        <div id="provider-detail"><p class="empty">Select a provider.</p></div>
      </div>
    </div>
  </div>

  <!-- Tab 2: App Settings -->
  <div class="tab-content" id="tab-apps">
    <div style="width:100%; padding:1.5rem; overflow-y:auto;">
      <h2>App → Provider Mapping</h2>
      <p class="hint">Pick a provider per app, then Apply to write its config file.</p>
      <div id="apps-list"><p class="empty">Loading…</p></div>
    </div>
  </div>

  <!-- Tab 3: Log -->
  <div class="tab-content" id="tab-log">
    <div style="width:100%; padding:1.5rem; overflow-y:auto;">
      <h2>Request Log</h2>
      <p class="hint">Proxy server not connected to GUI. Run <code>npm start</code> separately to generate traffic.</p>
      <div class="toolbar">
        <button id="clear-log-btn" class="danger">Clear Log</button>
      </div>
      <table class="log-table" id="log-table">
        <thead>
          <tr><th>Time</th><th>Provider</th><th>Model</th><th>Status</th><th>Latency</th></tr>
        </thead>
        <tbody id="log-body"></tbody>
      </table>
    </div>
  </div>

  <script>
    let selectedId = null;
    let refreshInterval = null;
    let allProviders = [];

    // Tab switching
    document.querySelectorAll(".tab-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".tab-btn").forEach((b) => b.classList.remove("active"));
        document.querySelectorAll(".tab-content").forEach((c) => c.classList.remove("active"));
        btn.classList.add("active");
        document.getElementById("tab-" + btn.dataset.tab).classList.add("active");
      });
    });

    function renderProviderList(providers) {
      const container = document.getElementById("provider-list");
      if (!providers || providers.length === 0) {
        container.innerHTML = '<p class="empty">No providers.</p>';
        return;
      }
      container.innerHTML = providers.map((p) => `
        <div class="list-item ${p.id === selectedId ? 'selected' : ''}" data-id="${p.id}">
          ${p.name}
          ${p.subscription ? `<span class="sub-badge">${p.subscription.type}</span>` : ""}
        </div>
      `).join("");

      container.querySelectorAll(".list-item").forEach((item) => {
        item.addEventListener("click", () => {
          selectedId = item.dataset.id;
          renderProviderList(providers);
          renderProviderDetail(providers);
        });
      });
    }

    function renderProviderDetail(providers) {
      const container = document.getElementById("provider-detail");
      if (!selectedId) {
        container.innerHTML = '<p class="empty">Select a provider.</p>';
        return;
      }
      const p = providers.find((x) => x.id === selectedId);
      if (!p) {
        container.innerHTML = '<p class="empty">Provider not found.</p>';
        return;
      }
      container.innerHTML = `
        <div class="detail-card">
          <h3>${p.name}</h3>
          <div class="meta">ID: ${p.id} · Format: ${p.apiFormat} · Models: ${(p.models || []).join(", ")}</div>
          <div class="edit-row">
            <label>Base URL:</label>
            <input type="text" data-field="url" value="${p.baseUrl}" />
          </div>
          <div class="edit-row">
            <label>API Keys:</label>
            <div style="flex:1; display:flex; flex-direction:column; gap:0.3rem;">
              ${(p.keys || []).map((k, i) => `
                <div class="edit-row" style="margin-bottom:0;">
                  <input type="password" data-key-idx="${i}" value="${k.value ? k.value : ''}" placeholder="key ${i+1}" />
                  <button type="button" data-rm-key="${i}" style="padding:0.3rem 0.6rem; flex-shrink:0;">✕</button>
                </div>
              `).join("")}
            </div>
          </div>
          <button type="button" id="add-key-btn" style="margin-bottom:0.6rem;">+ Add Key</button>
          ${p.subscription ? `
            <div class="edit-row">
              <label>Sub Token:</label>
              <input type="text" data-field="sub" placeholder="paste token here" />
            </div>
          ` : ""}
          <button id="save-btn">Save Changes</button>
        </div>
      `;

      const toggleBtn = document.getElementById("toggle-key");
      if (toggleBtn) {
        toggleBtn.addEventListener("click", () => {
          const keyInput = container.querySelector('[data-field="key"]');
          if (keyInput.type === "password") {
            keyInput.type = "text";
            toggleBtn.textContent = "🙈";
          } else {
            keyInput.type = "password";
            toggleBtn.textContent = "👁";
          }
        });
      }

      document.getElementById("add-key-btn").addEventListener("click", () => {
        const keysDiv = container.querySelector('[data-field="url"]')?.parentElement;
        if (!keysDiv) return;
        const newInput = document.createElement("div");
        newInput.className = "edit-row";
        newInput.style.marginBottom = "0";
        newInput.innerHTML = `<input type="password" data-key-idx="new" placeholder="new key" /><button type="button" data-rm-key="new" style="padding:0.3rem 0.6rem; flex-shrink:0;">✕</button>`;
        keysDiv.appendChild(newInput);
      });

      container.querySelectorAll("[data-rm-key]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const idx = btn.dataset.rmKey;
          const input = container.querySelector(`[data-key-idx="${idx}"]`);
          if (input) input.parentElement.remove();
        });
      });

      document.getElementById("save-btn").addEventListener("click", async () => {
        const urlInput = container.querySelector('[data-field="url"]');
        const subInput = container.querySelector('[data-field="sub"]');
        const keyInputs = container.querySelectorAll("[data-key-idx]");
        const updates = {};
        if (urlInput && urlInput.value) updates.baseUrl = urlInput.value;
        const keys = Array.from(keyInputs).map((el) => ({ value: el.value, status: "active" })).filter((k) => k.value);
        if (keys.length > 0) updates.keys = keys;
        if (subInput && subInput.value) updates.subscription = { type: "github_copilot", token: subInput.value };
        if (Object.keys(updates).length === 0) { alert("Nothing to save."); return; }
        const result = await window.ipc.invoke("providers:update", selectedId, updates);
        if (result.ok) {
          loadProviders();
        } else {
          alert(`Error: ${result.error}`);
        }
      });
    }

    function renderApps(apps, providers) {
      const container = document.getElementById("apps-list");
      if (!apps || apps.length === 0) {
        container.innerHTML = '<p class="empty">No apps found.</p>';
        return;
      }
      container.innerHTML = apps.map((a) => `
        <div class="app-row" data-app="${a.id}">
          <span class="app-name">${a.name}</span>
          <span class="app-status">${a.configExists ? "✓ config found" : "✗ no config"}</span>
          <select data-app-select="${a.id}" style="width:180px;">
            <option value="">— select —</option>
            ${providers.map((p) => `<option value="${p.id}">${p.name}</option>`).join("")}
          </select>
          <button data-apply="${a.id}">Apply</button>
        </div>
      `).join("");

      container.querySelectorAll("[data-apply]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          const appId = btn.dataset.apply;
          const select = container.querySelector(`[data-app-select="${appId}"]`);
          const providerId = select.value;
          if (!providerId) { alert("Select a provider first."); return; }
          const result = await window.ipc.invoke("apps:setProvider", appId, providerId);
          if (result.ok) {
            alert(`Applied: ${result.app} → ${result.provider}`);
          } else {
            alert(`Error: ${result.error}`);
          }
        });
      });
    }

    function renderLog(entries) {
      const tbody = document.getElementById("log-body");
      if (!entries || entries.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="empty">No requests logged.</td></tr>';
        return;
      }
      tbody.innerHTML = entries.map((e) => `
        <tr>
          <td>${new Date(e.timestamp).toLocaleTimeString()}</td>
          <td>${e.provider}</td>
          <td>${e.model || "—"}</td>
          <td class="${e.status >= 400 ? 'log-fail' : 'log-ok'}">${e.status}</td>
          <td>${e.latencyMs}ms</td>
        </tr>
      `).join("");
    }

    async function loadProviders() {
      const data = await window.ipc.invoke("providers:list");
      allProviders = data;
      renderProviderList(data);
      renderProviderDetail(data);
      return data;
    }

    async function loadApps(providers) {
      const apps = await window.ipc.invoke("apps:list");
      renderApps(apps, providers);
    }

    async function loadLog() {
      const data = await window.ipc.invoke("logs:get");
      renderLog(data);
    }

    document.getElementById("refresh-btn").addEventListener("click", async () => {
      const p = await loadProviders();
      loadApps(p);
    });

    document.getElementById("remove-btn").addEventListener("click", async () => {
      if (!selectedId) { alert("Select a provider first."); return; }
      if (!confirm(`Remove provider "${selectedId}"?`)) return;
      await window.ipc.invoke("providers:remove", selectedId);
      selectedId = null;
      loadProviders();
    });

    document.getElementById("clear-log-btn").addEventListener("click", async () => {
      await window.ipc.invoke("logs:clear");
      loadLog();
    });

    function startAutoRefresh() {
      if (refreshInterval) clearInterval(refreshInterval);
      refreshInterval = setInterval(() => {
        if (document.hasFocus()) {
          loadLog();
        }
      }, 2000);
    }

    document.addEventListener("DOMContentLoaded", () => {
      loadProviders().then((p) => loadApps(p));
      loadLog();
      startAutoRefresh();
    });
  </script>
</body>
</html>
