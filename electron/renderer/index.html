<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LLM Proxy</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #1a1a2e;
      color: #eee;
      margin: 0;
      padding: 2rem;
    }
    h1 {
      font-size: 1.5rem;
      color: #4fc3f7;
      margin-bottom: 1rem;
    }
    .toolbar {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }
    button {
      background: #4fc3f7;
      color: #1a1a2e;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }
    button:hover {
      background: #3ab4e8;
    }
    .provider-card {
      background: #16213e;
      border-radius: 8px;
      padding: 1rem;
      margin-bottom: 1rem;
    }
    .provider-card h2 {
      font-size: 1.1rem;
      color: #4fc3f7;
      margin: 0 0 0.5rem;
    }
    .meta {
      color: #888;
      font-size: 0.85rem;
      margin-bottom: 0.5rem;
    }
    .keys {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-top: 0.5rem;
    }
    .key-badge {
      padding: 0.2rem 0.6rem;
      border-radius: 4px;
      font-size: 0.8rem;
    }
    .key-active { background: #2e7d32; color: #a5d6a7; }
    .key-exhausted { background: #c62828; color: #ffcdd2; }
    .key-cooldown { background: #f9a825; color: #fff3e0; }
    .sub-info {
      margin-top: 0.5rem;
      font-size: 0.85rem;
      color: #aaa;
    }
    .empty {
      color: #666;
      font-style: italic;
    }
  </style>
</head>
<body>
  <h1>LLM Proxy — Providers</h1>
  <div class="toolbar">
    <button id="refresh-btn">Refresh</button>
  </div>
  <div id="providers-list">
    <p class="empty">Loading…</p>
  </div>

  <script>
    function renderProviders(providers) {
      const container = document.getElementById("providers-list");
      if (!providers || providers.length === 0) {
        container.innerHTML = '<p class="empty">No providers registered.</p>';
        return;
      }
      container.innerHTML = providers.map((p) => `
        <div class="provider-card">
          <h2>${p.name}</h2>
          <div class="meta">URL: ${p.baseUrl} · Format: ${p.apiFormat}</div>
          <div class="keys">
            ${p.keys.map((k) => `<span class="key-badge key-${k.status}">${k.status}</span>`).join("")}
          </div>
          ${p.subscription ? `
            <div class="sub-info">
              Subscription: ${p.subscription.type} · Token: ${p.subscription.tokenMasked} · Expires: ${p.subscription.expiresAt ?? "unknown"}
            </div>
          ` : ""}
        </div>
      `).join("");
    }

    async function loadProviders() {
      const data = await window.ipc.invoke("providers:list");
      renderProviders(data);
    }

    document.getElementById("refresh-btn").addEventListener("click", loadProviders);
    document.addEventListener("DOMContentLoaded", loadProviders);
  </script>
</body>
</html>
